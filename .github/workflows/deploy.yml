# Builds the site and uploads it to Hostinger every time a change is pushed to main.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftp.keystagelearning.org (shown in Hostinger hPanel > Files > FTP Accounts)
#   FTP_USERNAME  the FTP username from the same page
#   FTP_PASSWORD  the FTP password
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Skip upload (Hostinger details not added yet)
        if: env.HAS_FTP != 'true'
        run: echo "::notice::Site built. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to upload it to Hostinger."
      - name: Upload to Hostinger
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
